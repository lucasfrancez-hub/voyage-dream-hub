name: EditAir Desktop

on:
  # release oficial: só quando existir a tag (etapa manual de release)
  push:
    tags: ["editair-v*"]
  # build de teste (dev/beta): não publica nada, só gera artefato para baixar
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal do build de teste"
        type: choice
        default: dev
        options: [dev, beta]

jobs:
  teste:
    name: Build de teste (sem publicar)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: desktop
        run: npm install
      - name: Versão de teste
        working-directory: desktop
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version "${BASE%%-*}-${{ inputs.canal }}.${{ github.run_number }}" --no-git-tag-version
      - name: Preparar FFmpeg/FFprobe arm64
        working-directory: desktop
        run: npm run prepare:mac-binaries
      - name: Conferir sidecars antes do empacotamento
        working-directory: desktop
        run: bash scripts/verificar-sidecars.sh
      - name: Gerar DMG (arm64, ad-hoc, sem publicar)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # ativa o hook scripts/adhoc-sign.cjs (assinatura ad-hoc obrigatória no Apple Silicon)
          EDITAIR_ADHOC: "1"
        run: |
          npx electron-builder --mac --arm64 --publish never \
            --config.mac.identity=null \
            --config.mac.hardenedRuntime=false
      - name: Validar bundle (.app)
        working-directory: desktop
        run: |
          echo "== conteúdo de dist/"
          ls -lR dist | head -n 60
          bash scripts/verificar-app.sh dist/mac-arm64/EditAir.app
      - name: Validar DMG (monta, verifica e testa o app de dentro da imagem)
        working-directory: desktop
        run: |
          DMG=$(ls dist/*.dmg | head -n1)
          echo "DMG: $DMG"
          hdiutil verify "$DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          bash scripts/verificar-app.sh "$MNT/EditAir.app"
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: EditAir-${{ inputs.canal }}-dmg
          path: desktop/dist/*.dmg

  release:
    name: Release (GitHub Releases + auto-update)
    if: startsWith(github.ref, 'refs/tags/editair-v')
    strategy:
      matrix:
        include:
          - os: macos-14
            args: "--mac --arm64"
          - os: windows-latest
            args: "--win --x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: desktop
        run: npm install
      - name: Preparar FFmpeg/FFprobe arm64
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run prepare:mac-binaries
      - name: Conferir sidecars antes do empacotamento
        if: runner.os == 'macOS'
        working-directory: desktop
        run: bash scripts/verificar-sidecars.sh
      - name: Build + publicar release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: assinatura + notarização (opcionais enquanto não houver Apple Developer)
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.args }} --publish always
