<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>EditAir</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(1200px 600px at 50% -10%, #241206 0%, #0b0b0d 60%);
        color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-app-region: drag; text-align: center;
      }
      .card { max-width: 420px; padding: 32px; }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
      button {
        -webkit-app-region: no-drag; cursor: pointer; border: 0; border-radius: 10px;
        padding: 10px 20px; font-size: 14px; font-weight: 600; color: #fff;
        background: linear-gradient(180deg, #F58433, #F26B1F);
        box-shadow: 0 6px 24px rgba(242, 107, 31, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sem conexão</h1>
      <p>O EditAir precisa de internet para carregar a interface e os recursos de IA. Sua biblioteca e seus projetos continuam salvos no seu Mac.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
    <script>
      setInterval(() => { if (navigator.onLine) location.reload(); }, 5000);
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
