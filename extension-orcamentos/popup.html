<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 290px; margin: 0; padding: 14px; background: #0d2b45; color: #e8eef5;
        font: 400 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #F26B1F; }
      .muted { color: #9db0c4; font-size: 11px; }
      .row { margin-top: 12px; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18);
        background: rgba(255,255,255,.06); color: #fff; font-size: 12px; }
      button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #F26B1F;
        color: #fff; font-weight: 600; cursor: pointer; }
      a { color: #F26B1F; text-decoration: none; font-size: 12px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }
      .dot.off { background: #f59e0b; }
    </style>
  </head>
  <body>
    <h1>Via Air Orçamentos</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="state">…</span></div>
    <div class="row muted">Último: <span id="last">—</span></div>
    <div class="row muted">Sincronizações pendentes: <span id="pending">0</span></div>
    <div class="row">
      <div class="muted">Token de acesso (Pedidos → Orçamentos → Conectar plugin)</div>
      <input id="token" type="password" placeholder="Cole o token aqui" />
      <button id="save">Salvar token</button>
    </div>
    <div class="row"><a href="https://pedidos.viaair.tur.br/admin/orcamentos" target="_blank">Abrir Orçamentos na Via Air</a></div>
    <script src="popup.js"></script>
  </body>
</html>
